<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Felix 'FlanderDev' Leander — C# developer, modder, terminally online">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ff47" stop-opacity=".18"/>
      <stop offset="1" stop-color="#47c8ff" stop-opacity=".10"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="240" rx="14"/></clipPath>
    <style>
      .mono { font-family: 'DM Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .head { font-family: 'Syne', 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .line { opacity: 0; animation: in .5s ease-out forwards; }
      .l1 { animation-delay: .2s; } .l2 { animation-delay: .7s; } .l3 { animation-delay: 1.2s; } .l4 { animation-delay: 1.7s; }
      @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .line, .cursor { animation: none; opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="240" fill="#0a0a0f"/>
    <rect width="900" height="240" fill="url(#grid)"/>
    <circle cx="760" cy="40" r="220" fill="url(#glow)"/>
    <rect x=".5" y=".5" width="899" height="239" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- window chrome -->
    <circle cx="28" cy="26" r="5" fill="#ff5f57"/>
    <circle cx="46" cy="26" r="5" fill="#febc2e"/>
    <circle cx="64" cy="26" r="5" fill="#28c840"/>
    <text x="450" y="30" text-anchor="middle" class="mono" font-size="12" fill="#7878a0">~/flanderdev — zsh</text>

    <text x="40" y="78" class="mono line l1" font-size="14" fill="#7878a0"><tspan fill="#e8ff47">❯</tspan> whoami</text>
    <text x="40" y="128" class="head line l2" font-size="44" fill="#e8e8f0" letter-spacing="-1">Felix Leander<tspan fill="#e8ff47">.</tspan></text>
    <text x="40" y="162" class="mono line l3" font-size="15" fill="#47c8ff">C# / .NET developer · game modder · tool builder</text>
    <text x="40" y="200" class="mono line l4" font-size="14" fill="#7878a0"><tspan fill="#e8ff47">❯</tspan> sometimes creates usefull stuff,<tspan class="cursor" fill="#e8ff47"> ▍</tspan></text>

    <text x="860" y="218" text-anchor="end" class="mono" font-size="12" fill="#7878a0">🇩🇪 germany · flander.dev</text>
  </g>
</svg>
